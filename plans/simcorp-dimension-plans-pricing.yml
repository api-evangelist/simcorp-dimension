description: >-
  SimCorp publishes no plans, tiers or list pricing of any kind. SimCorp One (the platform
  SimCorp Dimension is delivered inside) is sold as an enterprise licence and/or a managed
  service through a sales motion — the 1,213-URL sitemap for simcorp.com contains no pricing
  page, and there is no self-service sign-up, trial or developer plan. API access is a
  consequence of holding a SimCorp licence, not a separately priced product. This file records
  that honest zero. The previous version carried a bulk-sweep scaffold with invented Free /
  Professional / Enterprise tiers and per-month quotas that SimCorp never published.
