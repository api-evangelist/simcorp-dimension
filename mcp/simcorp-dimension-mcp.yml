  endpoint nor a locally-installable stdio package. The SimCorp GitHub organization holds four
  public repositories, none MCP-related; npm and PyPI carry no SimCorp MCP package; and SimCorp's
  own surfaces (simcorp.com, thesim.dev) never use the term. No candidate tool list could be
  derived either, because SimCorp publishes no OpenAPI to derive one from — the Swagger
  documentation SimCorp advertises lives behind the thesim.dev portal login.
  No endpoint URL is guessed here. mode is none.
