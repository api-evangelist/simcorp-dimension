description: >-
  Lifecycle posture for the SimCorp Dimension API surface, established by probe rather than by
  reading a policy — because no policy is published. SimCorp operates no public status page, no
  public changelog or release-notes feed for its APIs, and no deprecation or sunset policy that a
  consumer can read without portal credentials. Two hosts a previous version of this profile
  claimed for exactly these purposes — status.simcorp.com and developer.simcorp.com/changelog —
  do not resolve, and were never SimCorp pages.
status_page:
