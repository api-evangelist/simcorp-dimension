    status: 0
    note: NXDOMAIN. Host does not resolve. No status page found on any other SimCorp host or on the common third-party providers.
deprecation_policy:
  present: false
  url: null
  sunset_header: unknown
  deprecation_header: unknown
  evidence:
    url: https://thesim.dev/gettingstarted/
    status: 200
    note: >-
      Any deprecation policy would live inside the credentialed Data Model Portal. Nothing is
      readable anonymously, and RFC 8594 Sunset/Deprecation header behaviour cannot be observed
      because no endpoint answers unauthenticated.
