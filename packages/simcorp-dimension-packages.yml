description: >-
  First-party client library search across npm, PyPI, Maven Central, NuGet, RubyGems, crates.io
  and the SimCorp GitHub organization. SimCorp ships no maintained SDK for the SimCorp Dimension
  Web / Data Distribution / Streaming APIs on any public registry. One first-party npm package
  exists — sc-cli, published from sik@simcorp.com against the internal simhub.simcorp.com git
  host — but it has not shipped a release since October 2018 and its source repository is not
  public, so its command surface cannot be read. It predates the SimCorp One / SIM API surface
  documented on thesim.dev and should not be treated as an SDK for it.
