description: >-
  RFC 8615 well-known probe of every host in this profile. NOTHING IS SERVED. Both live hosts
  answer every /.well-known/ path with an HTML error page — www.simcorp.com returns a 404 from
  its Next.js marketing site, thesim.dev returns a 404 from its Django portal — so there is no
  security.txt, no OpenID/OAuth discovery document, no api-catalog, no ai-plugin.json and no
  agent card anywhere on SimCorp's public surface. Because every path missed, this file
  deliberately carries NO WellKnown or SecurityTxt pointer in apis.yml: it documents an absence,
  and an absence must not be scored as a presence.
  Two hosts named in the previous profile could not be probed at all: developer.simcorp.com and
  status.simcorp.com do not resolve (NXDOMAIN), and api.simcorp.com resolves to 50.85.47.9 but
  never completes a TLS connection on 443 within a 12s ceiling.
