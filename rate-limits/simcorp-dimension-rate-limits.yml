description: >-
  SimCorp publishes no rate-limit documentation on any public surface. The SimCorp Data Model
  Portal (thesim.dev), which carries the Web API, Data Distribution API and Streaming API
  reference plus the Swagger documentation, requires portal credentials — SimCorp employees via
  corporate SSO, clients/vendors/partners via an assigned username and password. Nothing about
  quotas, throttling windows, burst behaviour or 429 response headers is readable without an
  account, and SimCorp Dimension is deployed per tenant, so any limits are likely contractual
  rather than published. This file records that honest zero. The previous version of this file
  carried a bulk-sweep scaffold (free 10/min, professional 100/min, enterprise 1000/min) that
  SimCorp never published; it has been removed rather than left to read as a provider claim.
