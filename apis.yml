modified: '2026-08-29'
# 2026-08-29 enrichment pass. Three API entries carried by earlier rounds — "SimCorp Dimension
# Data API", "SimCorp Dimension Integration API" and "SimCorp Dimension Analytics API" — were
# removed. SimCorp names no such products anywhere on its public surface; every URL supporting
# them was fabricated by a bulk scaffold sweep and every one of them is dead: their humanURLs
# (www.simcorp.com/products/simcorp-dimension*) return 404, and their Documentation, OpenAPI,
# Authentication, Webhooks and RateLimits properties pointed at developer.simcorp.com, a host
# that does not resolve (NXDOMAIN). The three entries retained below are the three API families
# SimCorp itself names on thesim.dev.
apis:
  - name: SimCorp Dimension Web API
    description: >-
      Web API providing HTTP-based interfaces for accessing and manipulating SimCorp Dimension
      data in real time, supporting stateless RESTful operations across the investment management
      lifecycle. Named by SimCorp on the Data Model Portal home page; the reference and Swagger
      documentation require portal credentials.
    image: https://avatars.githubusercontent.com/u/62388281?v=4
    humanURL: https://thesim.dev/
    x-base-url-status: not-published
    x-base-url-note: >-
      SimCorp publishes no base URL for this API. api.simcorp.com is a real SimCorp-controlled
      DNS record resolving into a Microsoft/Azure range, but 443 does not answer anonymously
      (one 12s attempt, no response), and no SimCorp page states a host or path. SimCorp
      Dimension is deployed per client, so the callable host is tenant-specific. The previous
      value, https://api.simcorp.com/dimension/web/v1, was a scaffold and has been removed
      rather than guessed at again.
    tags:
      - Investment Management
      - Real-Time Data
      - REST
      - Web API
    properties:
      - type: Documentation
        url: https://thesim.dev/
      - type: GettingStarted
        url: https://thesim.dev/gettingstarted/
    contact:
      - FN: SimCorp
        url: https://www.simcorp.com/about-us/contact
  - name: SimCorp Dimension Data Distribution API
    description: >-
      API for distributing and sharing investment data across integrated systems, supporting
      event streaming channels and direct data access from SimCorp Dimension. Named by SimCorp on
      the Data Model Portal home page alongside the Web APIs and Streaming APIs.
    image: https://avatars.githubusercontent.com/u/62388281?v=4
    humanURL: https://www.simcorp.com/solutions/simcorp-one/data-management
    x-base-url-status: not-published
    x-base-url-note: >-
      No base URL published. Previous value https://api.simcorp.com/dimension/datadistribution/v1
      was a scaffold; removed.
    tags:
      - Data Distribution
      - Data Sharing
      - Event Streaming
      - Integration
    properties:
      - type: Documentation
        url: https://thesim.dev/
      - type: GettingStarted
        url: https://thesim.dev/gettingstarted/
    contact:
      - FN: SimCorp
        url: https://www.simcorp.com/about-us/contact
  - name: SimCorp Dimension Streaming API
    description: >-
      Real-time streaming API for delivering live investment data, market updates and event-driven
      notifications from SimCorp Dimension. Named by SimCorp on the Data Model Portal home page.
      No AsyncAPI or event catalog is published anonymously.
    image: https://avatars.githubusercontent.com/u/62388281?v=4
    humanURL: https://www.simcorp.com/solutions/simcorp-one/data-management
    x-base-url-status: not-published
