name: SimCorp Dimension
description: >-
  SimCorp Dimension is the investment management system at the core of SimCorp One, the
  front-to-back platform SimCorp A/S (Copenhagen; part of Deutsche Boerse Group) sells to asset
  managers, insurers, pension funds, sovereign wealth funds and central banks. Its integration
  surface is the SimCorp Integration Model (SIM), which SimCorp presents as three API families —
  Web APIs for synchronous HTTP access, Data Distribution APIs for bulk and channel-based data
  sharing, and Streaming APIs for real-time, event-driven delivery — spanning portfolio
  management, trading and compliance, risk and performance, accounting, operations, data
  management and regulatory reporting. The reference documentation, Swagger documentation,
  example code and standardized Message Format Models are published on the SimCorp Data Model
  Portal at thesim.dev, which is credential-gated: SimCorp employees sign in with corporate SSO,
  and clients, vendors and partners sign in with a portal account SimCorp issues. No OpenAPI,
  AsyncAPI, GraphQL SDL or WSDL is reachable anonymously, and there is no self-service sign-up,
  trial or published pricing — API access follows from a SimCorp One licence.
